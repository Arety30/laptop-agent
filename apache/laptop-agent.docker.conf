# Apache gateway config for the Docker network (targets are service names).
# Mounted into the httpd:2.4 container by docker-compose.

ServerName laptop-agent.local
ProxyPreserveHost On
ProxyRequests Off

# the Discord bot's HTTP surface
ProxyPass        /bot/  http://bot:8765/
ProxyPassReverse /bot/  http://bot:8765/

# local n8n (email workflow)
ProxyPass        /n8n/  http://n8n:5678/n8n/
ProxyPassReverse /n8n/  http://n8n:5678/n8n/

# n8n editor websockets
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /n8n/(.*) ws://n8n:5678/n8n/$1 [P,L]
