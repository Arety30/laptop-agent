# Apache reverse-proxy gateway for laptop-agent.
# Apache is the single HTTP front door: it proxies the bot's own endpoint and
# the local n8n instance, so all HTTP traffic flows through one place.
#
# Install:
#   sudo a2enmod proxy proxy_http proxy_wstunnel
#   sudo cp apache/laptop-agent.conf /etc/apache2/sites-available/
#   sudo a2ensite laptop-agent
#   sudo systemctl reload apache2
#
# Endpoints after install:
#   http://127.0.0.1/bot/health              -> bot status
#   POST http://127.0.0.1/bot/trigger        -> start a task via HTTP
#   http://127.0.0.1/n8n/                     -> n8n UI / webhooks

<VirtualHost *:80>
    ServerName laptop-agent.local

    ProxyPreserveHost On
    ProxyRequests Off

    # ── the Discord bot's local HTTP surface ──
    ProxyPass        /bot/  http://127.0.0.1:8765/
    ProxyPassReverse /bot/  http://127.0.0.1:8765/

    # ── local n8n (email workflow lives here) ──
    ProxyPass        /n8n/  http://127.0.0.1:5678/
    ProxyPassReverse /n8n/  http://127.0.0.1:5678/

    # n8n uses websockets for its editor UI
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /n8n/(.*) ws://127.0.0.1:5678/$1 [P,L]

    ErrorLog  ${APACHE_LOG_DIR}/laptop-agent-error.log
    CustomLog ${APACHE_LOG_DIR}/laptop-agent-access.log combined
</VirtualHost>
